name: Update NBA scores and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nba-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check scoring rules
        run: npm test

      - name: Refresh season data
        id: scores
        continue-on-error: true
        run: npm run update

      - name: Keep last valid data if the feed fails
        if: steps.scores.outcome == 'failure'
        run: |
          git restore data
          echo '::warning::NBA refresh failed. Publishing the last saved scores.'

      - name: Confirm generated data exists
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const league=JSON.parse(fs.readFileSync("league.json")); if(!fs.existsSync(`data/seasons/${league.season}.json`)) throw new Error("The configured season has no saved snapshot. Retry the data update.");'

      - name: Save season snapshot
        run: |
          git config user.name 'NBA score updater'
          git config user.email 'nba-updater@users.noreply.github.com'

          git add data

          if ! git diff --cached --quiet; then
            git commit -m 'Update NBA scores'
            git push
          fi

      - uses: actions/configure-pages@v5

      - name: Stage public website
        run: |
          mkdir -p public
          cp index.html style.css app.mjs league.json public/
          cp -r assets public/
          mkdir -p public/data/seasons
          cp data/teams.json public/data/
          node --input-type=module -e 'import fs from "node:fs"; const league=JSON.parse(fs.readFileSync("league.json")); fs.copyFileSync(`data/seasons/${league.season}.json`, `public/data/seasons/${league.season}.json`);'
          touch public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4
        id: deployment